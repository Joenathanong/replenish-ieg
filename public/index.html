<header class="shellbar">
  <div class="shellbar__logo">IE</div>
  <div>
    <div class="shellbar__title">Monitoring Replenish</div>
    <div class="shellbar__subtitle">Basis: Qty Rack — Gudang Kecil</div>
  </div>
  <div class="shellbar__spacer"></div>
  <div class="shellbar__status" id="syncStatus">
    <span class="dot dot--busy"></span><span id="syncStatusText">Memuat…</span>
  </div>
  <button class="shellbar__btn" id="btnSync" title="Tarik data terbaru dari OCS sekarang">
    <svg class="icon"><use href="#i-refresh"/></svg><span>Sinkron</span>
  </button>
  <button class="shellbar__btn" id="btnSlide" title="Tampilan slide untuk layar gudang">
    <svg class="icon"><use href="#i-play"/></svg><span>Mode Slide</span>
  </button>
</header>

<nav class="tabbar">
  <button class="tabbar__item is-active" data-tab="monitoring">
    <svg class="icon"><use href="#i-monitor"/></svg> Monitoring
  </button>
  <button class="tabbar__item" data-tab="pengaturan">
    <svg class="icon"><use href="#i-settings"/></svg> Pengaturan
  </button>
  <button class="tabbar__item" data-tab="ambang">
    <svg class="icon"><use href="#i-box"/></svg> Ambang per Item
  </button>
  <button class="tabbar__item" data-tab="transaksi">
    <svg class="icon"><use href="#i-truck"/></svg> Transaksi Replenish
  </button>
  <button class="tabbar__item" data-tab="atp">
    <svg class="icon"><use href="#i-gauge"/></svg> ATP Monitoring
  </button>
  <button class="tabbar__item" data-tab="penjualan">
    <svg class="icon"><use href="#i-chart"/></svg> Penjualan
  </button>
  <button class="tabbar__item" data-tab="adjustment">
    <svg class="icon"><use href="#i-adjust"/></svg> Adjustment Stok
  </button>
  <button class="tabbar__item" data-tab="riwayat">
    <svg class="icon"><use href="#i-history"/></svg> Riwayat Sinkronisasi
  </button>
</nav>

<main id="main"></main>

<div id="dialogHost"></div>
<div id="slideHost"></div>

<script src="/js/replenish-tab.js"></script>
<script src="/js/adjustment-tab.js"></script>
<script src="/js/sales-tab.js"></script>
<script src="/js/atp-tab.js"></script>
<script src="/js/atp-views.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
